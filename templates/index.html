<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Đối chiếu Kế toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .upload-card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4 text-primary fw-bold">HỆ THỐNG ĐỐI CHIẾU SỔ PHỤ NGÂN HÀNG & KẾ TOÁN</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card upload-card p-4">
        <form action="/process" method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-success">1. File Sổ phụ ngân hàng (Excel)</label>
                    <input class="form-control form-control-lg" type="file" name="bank_file" accept=".xls,.xlsx" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-warning">2. File Dữ liệu kế toán tự nhập (Excel)</label>
                    <input class="form-control form-control-lg" type="file" name="acc_file" accept=".xls,.xlsx" required>
                </div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn">
                    <span id="btnText">ĐỐI CHIẾU DỮ LIỆU</span>
                    <div class="spinner-border spinner-border-sm text-light d-none" id="spinner" role="status"></div>
                </button>
            </div>
        </form>
    </div>
</div>
<script>
    document.getElementById('uploadForm').onsubmit = function() {
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('btnText').innerText = 'Đang xử lý...';
        document.getElementById('spinner').classList.remove('d-none');
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đối chiếu Ngân hàng - Kế toán</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #555;}
        input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background: #007bff; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Đối chiếu Kế toán</h2>
        <h2>Kim Phi</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>File Ngân hàng (Excel/CSV)</label>
                <input type="file" name="bank_file" required accept=".xlsx, .xls, .xlsm, .xlsb, .csv, .ods">
            </div>
            <div class="form-group">
                <label>File Kế toán (Excel/CSV)</label>
                <input type="file" name="acc_file" required accept=".xlsx, .xls, .xlsm, .xlsb, .csv, .ods">
            </div>
            <button type="submit" class="btn-submit">Đối chiếu</button>
        </form>
    </div>
</body>
</html>

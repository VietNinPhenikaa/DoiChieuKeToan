<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kết quả Đối chiếu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <h2 class="text-center text-success mb-4 fw-bold">ĐỐI CHIẾU HOÀN TẤT!</h2>
    
    <div class="row mb-4">
        <div class="col-md-12 text-center">
            <a href="/download/{{ download_file }}" class="btn btn-success btn-lg px-5 py-3 fs-4 fw-bold shadow">
                📥 TẢI FILE EXCEL KẾT QUẢ
            </a>
            <br><br>
            <a href="/" class="text-decoration-none">← Đối chiếu file khác</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-bold">TÓM TẮT KẾT QUẢ</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Chỉ tiêu</th>
                        <th>Số lượng</th>
                        <th>Giá trị tiền (VNĐ)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in summary[1:] %}
                    <tr>
                        <td class="fw-bold">{{ row[0] }}</td>
                        <td>{{ row[1] }}</td>
                        <td class="text-danger fw-bold">
                            {% if row[2] %} {{ "{:,.0f}".format(row[2]) }} {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
